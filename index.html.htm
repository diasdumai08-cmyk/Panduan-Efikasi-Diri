    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          state = {
            ...state,
            ...p,
            participant: { ...state.participant, ...(p.participant || {}) },
            lkData: { ...state.lkData, ...(p.lkData || {}) },
            reflection: { ...state.reflection, ...(p.reflection || {}) },
            assureOpen: { ...state.assureOpen, ...(p.assureOpen || {}) }
          };
        }
        const rRaw = localStorage.getItem(REKAP_STORAGE_KEY);
        if (rRaw) rekapRecords = JSON.parse(rRaw) || [];
        webhookUrl = localStorage.getItem(WEBHOOK_STORAGE_KEY) || &quot;&quot;;
        const qRaw = localStorage.getItem(QUEUE_STORAGE_KEY);
        if (qRaw) syncQueue = JSON.parse(qRaw) || [];
      } catch (e) {
        console.warn(&quot;Storage load warning:&quot;, e);
      }
    }

    function countFilledLKs() {
      const keys = [&quot;lk1&quot;, &quot;lk2&quot;, &quot;lk3&quot;, &quot;lk4&quot;, &quot;lk5&quot;, &quot;lk6&quot;];
      return keys.filter(k =&gt; Object.values(state.lkData[k] || {}).some(v =&gt; String(v || &quot;&quot;).trim().length &gt; 0)).length;
    }

    function computeProgressPct() {
      let pts = state.completedSessions.length; // max 6
      pts += countFilledLKs(); // max 6
      if (state.gsesPreScore !== null) pts++;
      if (state.gsesPostScore !== null) pts++;
      if (state.preTestResult) pts++;
      if (state.postTestResult) pts++;
      if (state.game1Done) pts++;
      if (state.game2Done) pts++;
      if (state.hotsScore !== null) pts++;
      return Math.min(100, Math.round((pts / 19) * 100));
    }

    function computeAssureMean() {
      const vals = Object.values(state.assureLikert || {}).map(Number).filter(v =&gt; v &gt;= 1 &amp;&amp; v &lt;= 5);
      if (!vals.length) return null;
      return Number((vals.reduce((a, b) =&gt; a + b, 0) / vals.length).toFixed(2));
    }

    function buildParticipantSnapshot(eventLabel = &quot;update&quot;) {
      const preT = state.preTestResult ? state.preTestResult.score : null;
      const postT = state.postTestResult ? state.postTestResult.score : null;
      const deltaTest = (preT !== null &amp;&amp; postT !== null) ? Number((postT - preT).toFixed(1)) : null;

      const gPre = state.gsesPreScore;
      const gPost = state.gsesPostScore;
      const deltaGses = (gPre !== null &amp;&amp; gPost !== null) ? (gPost - gPre) : null;

      return {
        id: &quot;rec_&quot; + Date.now() + &quot;_&quot; + Math.random().toString(36).slice(2, 6),
        timestamp: new Date().toLocaleString(&quot;id-ID&quot;, { hour12: false }),
        event: eventLabel,
        nama: (state.participant.name || &quot;&quot;).trim() || &quot;Peserta Tanpa Nama&quot;,
        npm: (state.participant.npm || &quot;&quot;).trim() || &quot;-&quot;,
        kelompok: (state.participant.kelompok || &quot;&quot;).trim() || &quot;-&quot;,
        fasilitator: (state.participant.fasilitator || &quot;&quot;).trim() || &quot;-&quot;,
        tahap: state.participant.tahap || &quot;-&quot;,
        persetujuan: state.participant.consent || &quot;SETUJU (Informed Consent Terkonfirmasi)&quot;,
        gsesPre: gPre,
        gsesPost: gPost,
        deltaGses: deltaGses,
        preTest: preT,
        postTest: postT,
        deltaTest: deltaTest,
        hots: state.hotsScore,
        assureMean: computeAssureMean(),
        lkCount: countFilledLKs()
      };
    }

    async function flushWebhookQueue() {
      if (!webhookUrl || syncQueue.length === 0) {
        renderRekapTable();
        return;
      }
      const rem = [];
      for (const item of syncQueue) {
        try {
          await fetch(webhookUrl, {
            method: &quot;POST&quot;,
            mode: &quot;no-cors&quot;,
            headers: { &quot;Content-Type&quot;: &quot;text/plain;charset=utf-8&quot; },
            body: JSON.stringify(item)
          });
        } catch (err) {
          rem.push(item);
        }
      }
      syncQueue = rem;
      try { localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(syncQueue)); } catch (e) {}
      renderRekapTable();
    }

    function recordParticipantEvent(eventLabel) {
      const snap = buildParticipantSnapshot(eventLabel);
      rekapRecords.unshift(snap);
      if (rekapRecords.length &gt; 500) rekapRecords = rekapRecords.slice(0, 500);
      try { localStorage.setItem(REKAP_STORAGE_KEY, JSON.stringify(rekapRecords)); } catch (e) {}
      if (webhookUrl) {
        syncQueue.push(snap);
        try { localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(syncQueue)); } catch (e) {}
        flushWebhookQueue();
      }
      renderRekapTable();
    }

    function saveState(eventLabel = null) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      if (eventLabel) recordParticipantEvent(eventLabel);
      refreshAllUI();
    }

    function completeSession(id) {
      const num = Number(id);

        saveState();

      selectSession(num);

    // =========================================================================
    // TAB 4: GSES CALCULATOR (PRE &amp; POST)
    // =========================================================================
    function getGsesCategory(score) {
      if (score === null || score === undefined) return { label: &quot;Skala 10–40&quot; };
      if (score &lt;= 22) return { label: &quot;Kategori Rendah (10–22)&quot; };
      if (score &lt;= 31) return { label: &quot;Kategori Sedang (23–31)&quot; };
      return { label: &quot;Kategori Tinggi (32–40)&quot; };
    }

    function renderGSES() {
      const box = document.getElementById(&quot;gses-items-container&quot;);
      box.innerHTML = GSES_ITEMS.map((txt, idx) =&gt; {
        const no = idx + 1;
        const cur = state.gsesAnswers[no] || 0;
        return `
          &lt;div class=&quot;p-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-2.5&quot;&gt;
            &lt;p class=&quot;text-xs sm:text-sm text-medNavy-900&quot;&gt;&lt;strong&gt;${no}.&lt;/strong&gt; ${txt}&lt;/p&gt;
            &lt;div class=&quot;flex gap-1.5 shrink-0&quot;&gt;
              ${[{v:1,l:&quot;STS (1)&quot;},{v:2,l:&quot;TS (2)&quot;},{v:3,l:&quot;CS (3)&quot;},{v:4,l:&quot;SS (4)&quot;}].map(o =&gt; `
                &lt;button type=&quot;button&quot; data-gses-no=&quot;${no}&quot; data-gses-val=&quot;${o.v}&quot; class=&quot;gses-opt-btn px-2.5 py-1.5 rounded-lg text-xs font-bold border cursor-pointer ${cur===o.v ? &quot;bg-sky-600 text-white border-sky-600&quot; : &quot;bg-white text-slate-700 border-slate-300 hover:bg-sky-50&quot;}&quot;&gt;${o.l}&lt;/button&gt;
              `).join(&quot;&quot;)}
            &lt;/div&gt;
          &lt;/div&gt;
        `;
      }).join(&quot;&quot;);

      box.querySelectorAll(&quot;.gses-opt-btn&quot;).forEach(btn =&gt; {
        btn.addEventListener(&quot;click&quot;, () =&gt; {
          state.gsesAnswers[Number(btn.dataset.gsesNo)] = Number(btn.dataset.gsesVal);
          renderGSES();
        });
      });

      const preS = state.gsesPreScore;
      const postS = state.gsesPostScore;
      document.getElementById(&quot;gses-summary-pre&quot;).textContent = preS !== null ? `${preS} / 40` : &quot;-&quot;;
      document.getElementById(&quot;gses-summary-post&quot;).textContent = postS !== null ? `${postS} / 40` : &quot;-&quot;;
      if (preS !== null &amp;&amp; postS !== null) {
        const d = postS - preS;
        document.getElementById(&quot;gses-summary-delta&quot;).textContent = `${d &gt;= 0 ? &quot;+&quot; + d : d} poin`;
      } else {
        document.getElementById(&quot;gses-summary-delta&quot;).textContent = &quot;-&quot;;
      }
    }

    function calculateGSES() {
      let total = 0;
      for (let i = 1; i &lt;= 10; i++) {
        if (!state.gsesAnswers[i]) {
          showToast(`Lengkapi butir GSES nomor ${i} terlebih dahulu.`, &quot;warning&quot;);
          return;
        }
        total += state.gsesAnswers[i];
      }
      const phase = document.getElementById(&quot;gses-phase-select&quot;).value;
      if (phase === &quot;pre&quot;) state.gsesPreScore = total;
      else state.gsesPostScore = total;
      if (!state.achievedCPs.includes(2)) state.achievedCPs.push(2);
      saveState(`GSES_${phase.toUpperCase()}`);
      renderGSES();

      const res = document.getElementById(&quot;gses-result-box&quot;);
      res.classList.remove(&quot;hidden&quot;);
      res.innerHTML = `
        &lt;h4 class=&quot;font-display text-xl font-extrabold&quot;&gt;Skor GSES (${phase === &quot;pre&quot; ? &quot;PRE / SOSIALISASI&quot; : &quot;POST / HARI KE-10&quot;}): ${total} / 40 (Rata-rata ${(total / 10).toFixed(2)})&lt;/h4&gt;
        &lt;p class=&quot;text-xs sm:text-sm text-sky-100&quot;&gt;${getGsesCategory(total).label} — Tersimpan pada indikator Kirkpatrick Level 2 dan rekap penelitian.&lt;/p&gt;
      `;
      showToast(`Skor GSES ${phase.toUpperCase()} (${total}/40) tersimpan!`, &quot;success&quot;);
    }

    // =========================================================================
    // TAB 5: PRE &amp; POST-TEST 40 SOAL (LAMPIRAN 2)
    // =========================================================================
    let examMode = &quot;pre&quot;;
    let examAllScroll = false;
    let examIdx = 0;
    let examUserAns = {};
    let examFlags = {};
    let examTimer = null;
    let examSecLeft = 1800;
    let examPaused = false;

    function selectExamMode(m) {
      examMode = m;
      clearInterval(examTimer);
      examPaused = false;
      document.getElementById(&quot;exam-runner&quot;).classList.add(&quot;hidden&quot;);
      document.getElementById(&quot;exam-start-card&quot;).classList.remove(&quot;hidden&quot;);
      document.getElementById(&quot;exam-result-box&quot;).classList.add(&quot;hidden&quot;);

      document.getElementById(&quot;mode-card-pre&quot;).className = m === &quot;pre&quot;
        ? &quot;p-4 rounded-2xl border-2 border-teal-600 bg-teal-50/60 cursor-pointer transition&quot;
        : &quot;p-4 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition&quot;;
      document.getElementById(&quot;mode-card-post&quot;).className = m === &quot;post&quot;
        ? &quot;p-4 rounded-2xl border-2 border-amber-600 bg-amber-50/60 cursor-pointer transition&quot;
        : &quot;p-4 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer transition&quot;;

      document.getElementById(&quot;exam-start-title&quot;).textContent = m === &quot;pre&quot;
        ? &quot;Mulai PRE-TEST (40 Soal Pilihan Ganda A–E)&quot;
        : &quot;Mulai POST-TEST (40 Soal Pilihan Ganda A–E)&quot;;

      const saved = m === &quot;pre&quot; ? state.preTestResult : state.postTestResult;
      if (saved) show40Result(saved, m);
    }

    function begin40Exam(allMode) {
      examAllScroll = allMode;
      examIdx = 0;
      examUserAns = {};
      examFlags = {};
      examSecLeft = 1800;
      examPaused = false;

      document.getElementById(&quot;exam-start-card&quot;).classList.add(&quot;hidden&quot;);
      document.getElementById(&quot;exam-result-box&quot;).classList.add(&quot;hidden&quot;);
      document.getElementById(&quot;exam-runner&quot;).classList.remove(&quot;hidden&quot;);
      document.getElementById(&quot;exam-single-nav&quot;).classList.toggle(&quot;hidden&quot;, allMode);
      document.getElementById(&quot;exam-ans-count&quot;).textContent = &quot;0&quot;;
      document.getElementById(&quot;btn-timer-toggle&quot;).textContent = &quot;Jeda&quot;;

      const badge = document.getElementById(&quot;exam-runner-badge&quot;);
      badge.textContent = (examMode === &quot;pre&quot; ? &quot;PRE-TEST&quot; : &quot;POST-TEST&quot;) + (allMode ? &quot; (SEMUA SOAL)&quot; : &quot;&quot;);
      badge.className = examMode === &quot;pre&quot;
        ? &quot;px-3 py-1 rounded-lg bg-teal-400 text-medNavy-950 text-xs font-extrabold&quot;
        : &quot;px-3 py-1 rounded-lg bg-amber-400 text-medNavy-950 text-xs font-extrabold&quot;;

      render40Questions();
      render40Grid();
      start40Timer();
    }

    function start40Timer() {
      clearInterval(examTimer);
      const disp = document.getElementById(&quot;exam-timer-text&quot;);
      const paint = () =&gt; {
        const m = Math.floor(examSecLeft / 60);
        const s = examSecLeft % 60;
        disp.textContent = `${String(m).padStart(2, &quot;0&quot;)}:${String(s).padStart(2, &quot;0&quot;)}`;
      };
      paint();
      examTimer = setInterval(() =&gt; {
        if (examPaused) return;
        examSecLeft--;
        paint();
        if (examSecLeft &lt;= 0) {
          clearInterval(examTimer);
          finish40Exam();
        }
      }, 1000);
    }

    function render40Questions() {
      const box = document.getElementById(&quot;exam-questions-box&quot;);
      if (examAllScroll) {
        box.innerHTML = QUESTIONS_40.map(item =&gt; `
          &lt;div id=&quot;q40-row-${item.no}&quot; class=&quot;p-4 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-2.5&quot;&gt;
            &lt;p class=&quot;font-bold text-sm text-medNavy-900&quot;&gt;&lt;span class=&quot;text-teal-700 mr-1&quot;&gt;${item.no}.&lt;/span&gt;${item.q} &lt;span class=&quot;text-[11px] font-semibold text-slate-500&quot;&gt;[CP ${item.cp} • ${item.cog}]&lt;/span&gt;&lt;/p&gt;
            &lt;div class=&quot;space-y-1.5&quot;&gt;
              ${item.opts.map((opt, oi) =&gt; `

                  &lt;input type=&quot;radio&quot; name=&quot;q40_${item.no}&quot; data-qno=&quot;${item.no}&quot; data-qoi=&quot;${oi}&quot; ${examUserAns[item.no] === oi ? &quot;checked&quot; : &quot;&quot;} class=&quot;q40-radio mt-0.5 accent-teal-600&quot;&gt;
                  &lt;span&gt;&lt;strong&gt;${String.fromCharCode(65 + oi)}.&lt;/strong&gt; ${opt}&lt;/span&gt;

        `).join(&quot;&quot;);

      const item = QUESTIONS_40[examIdx];

      box.innerHTML = `
        &lt;div class=&quot;flex items-center justify-between border-b border-slate-100 pb-3&quot;&gt;
          &lt;span class=&quot;px-3 py-1 rounded-full bg-medNavy-800 text-white text-xs font-bold&quot;&gt;Soal ${item.no} / 40&lt;/span&gt;
          &lt;span class=&quot;px-2.5 py-1 rounded-lg bg-teal-50 text-teal-800 text-xs font-bold&quot;&gt;CP ${item.cp} • ${item.cog}&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;font-bold text-base sm:text-lg text-medNavy-900 leading-relaxed&quot;&gt;${item.q}&lt;/p&gt;
        &lt;div class=&quot;space-y-2.5&quot;&gt;
          ${item.opts.map((opt, oi) =&gt; `
            &lt;div data-qno=&quot;${item.no}&quot; data-qoi=&quot;${oi}&quot; class=&quot;q40-card-opt p-3.5 rounded-2xl border-2 flex items-start gap-3 cursor-pointer ${chosen === oi ? &quot;border-teal-600 bg-teal-50/80&quot; : &quot;border-slate-200 bg-white hover:border-teal-400&quot;}&quot;&gt;
              &lt;span class=&quot;w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${chosen === oi ? &quot;bg-teal-600 text-white&quot; : &quot;bg-slate-100 text-slate-700&quot;}&quot;&gt;${String.fromCharCode(65 + oi)}&lt;/span&gt;
              &lt;span class=&quot;text-xs sm:text-sm text-medNavy-900 pt-1&quot;&gt;${opt}&lt;/span&gt;

      box.querySelectorAll(&quot;.q40-card-opt&quot;).forEach(card =&gt; {
        card.addEventListener(&quot;click&quot;, () =&gt; choose40(Number(card.dataset.qno), Number(card.dataset.qoi)));
      });
      document.getElementById(&quot;btn-flag-40&quot;).textContent = examFlags[item.no] ? &quot;⚑ Hapus Ragu-ragu&quot; : &quot;⚑ Tandai Ragu-ragu&quot;;
    }

    function choose40(no, oi) {
      examUserAns[no] = oi;
      document.getElementById(&quot;exam-ans-count&quot;).textContent = String(Object.keys(examUserAns).length);
      render40Questions();
      render40Grid();
    }

    function render40Grid() {
      const filter = document.getElementById(&quot;exam-filter-select&quot;).value;
      const g = document.getElementById(&quot;exam-num-grid&quot;);
      g.innerHTML = QUESTIONS_40.filter(item =&gt; {
        const ans = examUserAns[item.no] !== undefined;
        const flg = !!examFlags[item.no];
        if (filter === &quot;unanswered&quot;) return !ans;
        if (filter === &quot;flagged&quot;) return flg;
        return true;
      }).map(item =&gt; {
        const idx = item.no - 1;
        const ans = examUserAns[item.no] !== undefined;
        const flg = !!examFlags[item.no];
        const cur = !examAllScroll &amp;&amp; examIdx === idx;
        let cls = &quot;bg-slate-100 text-slate-700 border-slate-300&quot;;
        if (flg) cls = &quot;bg-amber-400 text-medNavy-950 border-amber-500&quot;;
        else if (ans) cls = &quot;bg-teal-600 text-white border-teal-600&quot;;
        if (cur) cls += &quot; ring-2 ring-medNavy-900&quot;;
        return `&lt;button type=&quot;button&quot; data-jump-idx=&quot;${idx}&quot; class=&quot;q40-jump-btn h-8 rounded-lg border text-xs font-bold cursor-pointer ${cls}&quot;&gt;${item.no}&lt;/button&gt;`;
      }).join(&quot;&quot;);

      g.querySelectorAll(&quot;.q40-jump-btn&quot;).forEach(btn =&gt; {
        btn.addEventListener(&quot;click&quot;, () =&gt; {
          const idx = Number(btn.dataset.jumpIdx);
          if (examAllScroll) {
            const el = document.getElementById(`q40-row-${idx + 1}`);
            if (el) el.scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;center&quot; });
          } else {
            examIdx = idx;
            render40Questions();
            render40Grid();
          }
        });
      });
    }

    function finish40Exam() {
      clearInterval(examTimer);
      let correct = 0;
      const cpStats = {};
      for (let c = 1; c &lt;= 8; c++) cpStats[c] = { correct: 0, total: 0 };

      QUESTIONS_40.forEach(item =&gt; {
        cpStats[item.cp].total++;
        if (examUserAns[item.no] === item.ans) {
          correct++;
          cpStats[item.cp].correct++;
        }
      });

      const score = Number((correct * 2.5).toFixed(1));
      const payload = { score, correct, cpStats, answers: { ...examUserAns } };

      if (examMode === &quot;pre&quot;) {
        state.preTestResult = payload;
      } else {
        state.postTestResult = payload;
        Object.entries(cpStats).forEach(([cpId, st]) =&gt; {
          if (st.correct / st.total &gt;= 0.6 &amp;&amp; !state.achievedCPs.includes(Number(cpId))) {
            state.achievedCPs.push(Number(cpId));
          }
        });
      }

      saveState(`${examMode.toUpperCase()}-TEST_40`);
      updatePrePostBanner();
      document.getElementById(&quot;exam-runner&quot;).classList.add(&quot;hidden&quot;);
      show40Result(payload, examMode);
      showToast(`${examMode.toUpperCase()}-TEST selesai! Skor: ${score}/100 (${correct}/40 benar).`, &quot;success&quot;);
    }

    function show40Result(res, mode) {
      const box = document.getElementById(&quot;exam-result-box&quot;);
      box.classList.remove(&quot;hidden&quot;);
      box.innerHTML = `
        &lt;div class=&quot;flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4&quot;&gt;
          &lt;div&gt;
            &lt;span class=&quot;px-3 py-1 rounded-full ${mode === &quot;post&quot; ? &quot;bg-amber-100 text-amber-900&quot; : &quot;bg-teal-100 text-teal-900&quot;} text-xs font-bold&quot;&gt;
              HASIL ${mode.toUpperCase()}-TEST
            &lt;/span&gt;
            &lt;h3 class=&quot;font-display text-2xl font-extrabold text-medNavy-800 mt-1&quot;&gt;Skor: ${res.score} / 100&lt;/h3&gt;
            &lt;p class=&quot;text-xs text-slate-600&quot;&gt;Benar ${res.correct} dari 40 soal (${res.correct} × 2,5 = ${res.score}) • Kunci tidak dibagikan otomatis ke peserta.&lt;/p&gt;
          &lt;/div&gt;
          &lt;button type=&quot;button&quot; id=&quot;btn-retake-40&quot; class=&quot;px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold cursor-pointer&quot;&gt;Ulangi Tes&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-3&quot;&gt;
          ${CP_DATA.map(cp =&gt; {
            const st = res.cpStats[cp.id] || { correct: 0, total: 1 };
            const pct = Math.round((st.correct / st.total) * 100);
            return `
              &lt;div class=&quot;p-3 rounded-2xl border border-slate-200 bg-slate-50/60&quot;&gt;
                &lt;div class=&quot;flex justify-between text-xs font-bold&quot;&gt;
                  &lt;span&gt;CP ${cp.id} (${st.correct}/${st.total})&lt;/span&gt;
                  &lt;span class=&quot;text-teal-700&quot;&gt;${pct}%&lt;/span&gt;
                &lt;/div&gt;
                &lt;p class=&quot;text-[11px] text-slate-600 mt-0.5&quot;&gt;${cp.text}&lt;/p&gt;
              &lt;/div&gt;
            `;
          }).join(&quot;&quot;)}
        &lt;/div&gt;
      `;
      document.getElementById(&quot;btn-retake-40&quot;).addEventListener(&quot;click&quot;, () =&gt; begin40Exam(false));
    }

    function updatePrePostBanner() {
      const pre = state.preTestResult;
      const post = state.postTestResult;
      document.getElementById(&quot;badge-pre-score&quot;).textContent = pre ? `Skor: ${pre.score}/100` : &quot;Belum Diisi&quot;;
      document.getElementById(&quot;badge-post-score&quot;).textContent = post ? `Skor: ${post.score}/100` : &quot;Belum Diisi&quot;;

      const ban = document.getElementById(&quot;prepost-delta-banner&quot;);
      if (pre || post) {
        ban.classList.remove(&quot;hidden&quot;);
        const delta = (pre &amp;&amp; post) ? (post.score - pre.score).toFixed(1) : null;
        ban.innerHTML = `
          &lt;div class=&quot;flex flex-wrap items-center justify-between gap-4 text-xs sm:text-sm&quot;&gt;
            &lt;span&gt;Pre-Test: &lt;strong&gt;${pre ? pre.score + &quot;/100&quot; : &quot;-&quot;}&lt;/strong&gt;&lt;/span&gt;
            &lt;span&gt;Post-Test: &lt;strong&gt;${post ? post.score + &quot;/100&quot; : &quot;-&quot;}&lt;/strong&gt;&lt;/span&gt;
            &lt;span class=&quot;px-3 py-1 rounded-lg bg-teal-500/20 text-teal-200 font-extrabold&quot;&gt;
              Selisih (Δ Skor): ${delta !== null ? (Number(delta) &gt;= 0 ? &quot;+&quot; + delta : delta) + &quot; poin&quot; : &quot;Isi Pre &amp; Post untuk Δ&quot;}
            &lt;/span&gt;
          &lt;/div&gt;
        `;
      }
    }

    // =========================================================================
    // TAB 6: ACTIVITIES, BREATHING 4-2-6 &amp; 2 GAMES
    // =========================================================================
    function switchActSubtab(actName) {
      document.querySelectorAll(&quot;.act-panel&quot;).forEach(p =&gt; p.classList.add(&quot;hidden&quot;));
      document.getElementById(`act-panel-${actName}`).classList.remove(&quot;hidden&quot;);

      document.querySelectorAll(&quot;.act-btn&quot;).forEach(b =&gt; {
        b.className = b.dataset.act === actName
          ? &quot;act-btn px-4 py-2 rounded-xl text-xs font-bold bg-medNavy-800 text-white cursor-pointer&quot;
          : &quot;act-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-teal-50 cursor-pointer&quot;;
      });
    }

    // Sorting
    let selectedSortId = null;
    let placedSort = {};
    function initSortingActivity() {
      selectedSortId = null;
      placedSort = {};
      [&quot;mastery&quot;, &quot;vicarious&quot;, &quot;verbal&quot;, &quot;physiological&quot;].forEach(b =&gt; {
        document.getElementById(`bucket-${b}`).innerHTML = &quot;&quot;;
      });
      renderSortingPool();
    }

    function renderSortingPool() {
      const rem = SORT_CARDS.filter(c =&gt; !placedSort[c.id]);
      document.getElementById(&quot;sort-remaining&quot;).textContent = rem.length;
      const pool = document.getElementById(&quot;sorting-pool&quot;);
      if (rem.length === 0) {
        pool.innerHTML = `&lt;div class=&quot;col-span-full p-3 rounded-xl bg-emerald-100 text-emerald-900 font-bold text-sm text-center&quot;&gt;✓ Semua 8 kartu sumber efikasi diri berhasil diklasifikasikan!&lt;/div&gt;`;
        state.sortingDone = true;
        if (!state.achievedCPs.includes(1)) state.achievedCPs.push(1);
        saveState();
        return;
      }
      pool.innerHTML = rem.map(c =&gt; `
        &lt;div draggable=&quot;true&quot; data-card-id=&quot;${c.id}&quot; class=&quot;sort-card-item p-3 rounded-xl bg-white border-2 text-xs sm:text-sm cursor-pointer ${selectedSortId === c.id ? &quot;border-teal-600 bg-teal-50/50&quot; : &quot;border-slate-200&quot;}&quot;&gt;
          ${c.text}
        &lt;/div&gt;
      `).join(&quot;&quot;);

      pool.querySelectorAll(&quot;.sort-card-item&quot;).forEach(el =&gt; {
        el.addEventListener(&quot;dragstart&quot;, () =&gt; { selectedSortId = el.dataset.cardId; });
        el.addEventListener(&quot;click&quot;, () =&gt; {
          selectedSortId = el.dataset.cardId;
          renderSortingPool();
        });
      });
    }

    function placeSort(id, bucket) {
      const card = SORT_CARDS.find(c =&gt; c.id === id);
      if (!card) return;
      if (card.cat === bucket) {
        placedSort[id] = bucket;
        selectedSortId = null;
        const item = document.createElement(&quot;div&quot;);
        item.className = &quot;p-2 rounded-lg bg-white border border-slate-200 text-xs&quot;;
        item.textContent = &quot;✓ &quot; + card.text;
        document.getElementById(`bucket-${bucket}`).appendChild(item);
        renderSortingPool();
        showToast(&quot;Klasifikasi tepat!&quot;, &quot;success&quot;);
      } else {
        showToast(&quot;Kurang tepat, periksa kembali sumber efikasi pada kartu tersebut.&quot;, &quot;warning&quot;);
      }
    }

    // Calibration
    let calibPred = 0;
    let calibAns = {};
    function setCalibPrediction(p) {
      calibPred = p;
      calibAns = {};
      document.getElementById(&quot;calib-pred-display&quot;).textContent = p;
      document.getElementById(&quot;calib-step-1&quot;).classList.add(&quot;hidden&quot;);
      document.getElementById(&quot;calib-step-2&quot;).classList.remove(&quot;hidden&quot;);
      document.getElementById(&quot;calib-step-3&quot;).classList.add(&quot;hidden&quot;);

      const qBox = document.getElementById(&quot;calib-quiz-questions&quot;);
      qBox.innerHTML = CALIB_QUESTIONS.map((item, idx) =&gt; `
        &lt;div class=&quot;p-4 rounded-2xl border border-slate-200 bg-slate-50/60 space-y-2&quot;&gt;
          &lt;p class=&quot;font-bold text-xs sm:text-sm text-medNavy-800&quot;&gt;${idx + 1}. ${item.q}&lt;/p&gt;
          &lt;div class=&quot;grid grid-cols-1 sm:grid-cols-2 gap-2&quot;&gt;
            ${item.opts.map((o, oi) =&gt; `
              &lt;label class=&quot;flex items-center gap-2 p-2.5 rounded-xl bg-white border border-slate-200 text-xs cursor-pointer&quot;&gt;
                &lt;input type=&quot;radio&quot; name=&quot;cq_${idx}&quot; data-cq-idx=&quot;${idx}&quot; data-cq-oi=&quot;${oi}&quot; class=&quot;cq-radio accent-teal-600&quot;&gt;
                &lt;span&gt;${o}&lt;/span&gt;
              &lt;/label&gt;
            `).join(&quot;&quot;)}
          &lt;/div&gt;
        &lt;/div&gt;
      `).join(&quot;&quot;);

      qBox.querySelectorAll(&quot;.cq-radio&quot;).forEach(r =&gt; {
        r.addEventListener(&quot;change&quot;, () =&gt; { calibAns[Number(r.dataset.cqIdx)] = Number(r.dataset.cqOi); });
      });
    }

    function submitCalibQuiz() {
      if (Object.keys(calibAns).length &lt; 5) {
        showToast(&quot;Jawab semua 5 soal kalibrasi terlebih dahulu.&quot;, &quot;warning&quot;);
        return;
      }
      let actual = 0;
      CALIB_QUESTIONS.forEach((item, idx) =&gt; { if (calibAns[idx] === item.ans) actual++; });
      const diff = calibPred - actual;
      const label = diff &gt; 0 ? `Selisih Positif (+${diff}): Keyakinan &gt; Performa (Tinjau persiapan &amp; bukti)`
        : (diff &lt; 0 ? `Selisih Negatif (${diff}): Keyakinan &lt; Performa (Akui keberhasilan Anda!)`
        : &quot;Selisih 0: Terkalibrasi Tepat!&quot;);

      state.calibDone = true;
      if (!state.achievedCPs.includes(4)) state.achievedCPs.push(4);
      saveState();

      const s3 = document.getElementById(&quot;calib-step-3&quot;);
      s3.classList.remove(&quot;hidden&quot;);
      s3.innerHTML = `
        &lt;h4 class=&quot;font-display font-bold text-lg text-medNavy-800&quot;&gt;Prediksi: ${calibPred}/5 • Hasil: ${actual}/5 • Selisih = ${diff}&lt;/h4&gt;
        &lt;p class=&quot;text-xs sm:text-sm text-slate-700&quot;&gt;${label}&lt;/p&gt;
        &lt;button type=&quot;button&quot; id=&quot;btn-retry-calib&quot; class=&quot;px-4 py-2 rounded-xl bg-medNavy-800 text-white text-xs font-bold cursor-pointer&quot;&gt;Ulangi Kalibrasi&lt;/button&gt;
      `;
      document.getElementById(&quot;btn-retry-calib&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        document.getElementById(&quot;calib-step-1&quot;).classList.remove(&quot;hidden&quot;);
        document.getElementById(&quot;calib-step-2&quot;).classList.add(&quot;hidden&quot;);
        document.getElementById(&quot;calib-step-3&quot;).classList.add(&quot;hidden&quot;);
      });
    }

    // Breathing 4-2-6 Timer
    let breathInterval = null;
    let breathSec = 0;
    let breathCycles = 0;

    function startBreathing426() {
      stopBreathing426();
      breathSec = 0;
      breathCycles = 0;
      const orb = document.getElementById(&quot;breath-orb&quot;);
      const phaseLbl = document.getElementById(&quot;breath-phase-label&quot;);
      const countLbl = document.getElementById(&quot;breath-count-num&quot;);
      const cycleInfo = document.getElementById(&quot;breath-cycle-info&quot;);

      const tick = () =&gt; {
        const mod = breathSec % 12;
        if (mod &lt; 4) {
          phaseLbl.textContent = &quot;TARIK NAPAS&quot;;
          countLbl.textContent = String(mod + 1);
          orb.style.transform = &quot;scale(1.38)&quot;;
          orb.style.backgroundColor = &quot;#0d9488&quot;;
        } else if (mod &lt; 6) {
          phaseLbl.textContent = &quot;TAHAN&quot;;
          countLbl.textContent = String(mod - 3);
          orb.style.transform = &quot;scale(1.38)&quot;;
          orb.style.backgroundColor = &quot;#0284c7&quot;;
        } else {
          phaseLbl.textContent = &quot;BUANG NAPAS&quot;;
          countLbl.textContent = String(mod - 5);
          orb.style.transform = &quot;scale(1.0)&quot;;
          orb.style.backgroundColor = &quot;#10b981&quot;;
        }

        if (breathSec &gt; 0 &amp;&amp; mod === 0) {
          breathCycles++;
          cycleInfo.textContent = `Siklus Selesai: ${breathCycles} / 6 siklus`;
          if (breathCycles &gt;= 6) {
            stopBreathing426();
            state.breathingDone = true;
            if (!state.achievedCPs.includes(6)) state.achievedCPs.push(6);
            saveState();
            phaseLbl.textContent = &quot;SELESAI ✓&quot;;
            countLbl.textContent = &quot;Tenang&quot;;
            showToast(&quot;Latihan pernapasan 4-2-6 (6 siklus) selesai!&quot;, &quot;success&quot;);
          }
        }
        breathSec++;
      };
      tick();
      breathInterval = setInterval(tick, 1000);
    }

    function stopBreathing426() {
      if (breathInterval) clearInterval(breathInterval);
      breathInterval = null;
      const orb = document.getElementById(&quot;breath-orb&quot;);
      if (orb) {
        orb.style.transform = &quot;scale(1)&quot;;
        orb.style.backgroundColor = &quot;#0d9488&quot;;
      }
      document.getElementById(&quot;breath-phase-label&quot;).textContent = &quot;SIAP&quot;;
      document.getElementById(&quot;breath-count-num&quot;).textContent = &quot;4-2-6&quot;;
    }

    let g1Pts = 0;
    let g1Hp = 3;

      document.getElementById(&quot;g1-score&quot;).textContent = String(g1Pts);
      document.getElementById(&quot;g1-lives&quot;).textContent = &quot;❤️&quot;.repeat(Math.max(0, g1Hp)) || &quot;💔&quot;;

      if (g1Hp &lt;= 0 || g1Idx &gt;= GAME1_CASES.length) {

        if (!state.achievedCPs.includes(5)) state.achievedCPs.push(5);
        saveState();
        stg.innerHTML = `
          &lt;div class=&quot;p-6 rounded-2xl bg-slate-50 border border-slate-200 text-center space-y-3&quot;&gt;
            &lt;h4 class=&quot;font-display text-xl font-bold text-medNavy-800&quot;&gt;${g1Hp &gt; 0 ? &quot;🎉 5 Kasus Med-Clinic Selesai!&quot; : &quot;Stamina Psikologis Habis&quot;}&lt;/h4&gt;
            &lt;p class=&quot;text-sm text-slate-700&quot;&gt;Skor Akhir: &lt;strong&gt;${g1Pts} / 100&lt;/strong&gt;&lt;/p&gt;
            &lt;button type=&quot;button&quot; id=&quot;btn-replay-g1&quot; class=&quot;px-5 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-bold cursor-pointer&quot;&gt;Mainkan Lagi&lt;/button&gt;
          &lt;/div&gt;
        `;
        document.getElementById(&quot;btn-replay-g1&quot;).addEventListener(&quot;click&quot;, () =&gt; {
          g1Idx = 0; g1Pts = 0; g1Hp = 3; renderGame1();
        });

      }

      const c = GAME1_CASES[g1Idx];
      stg.innerHTML = `
        &lt;div class=&quot;space-y-4&quot;&gt;
          &lt;span class=&quot;text-xs font-bold text-teal-700&quot;&gt;Level ${g1Idx + 1} / ${GAME1_CASES.length}&lt;/span&gt;
          &lt;h4 class=&quot;font-display text-lg font-bold text-medNavy-800&quot;&gt;${c.title}&lt;/h4&gt;
          &lt;p class=&quot;text-sm text-slate-700 bg-slate-50 p-4 rounded-2xl border border-slate-200&quot;&gt;${c.desc}&lt;/p&gt;
          &lt;div class=&quot;space-y-2.5&quot;&gt;
            ${c.choices.map((ch, idx) =&gt; `
              &lt;button type=&quot;button&quot; data-g1-opt=&quot;${idx}&quot; class=&quot;g1-opt-btn w-full p-3.5 rounded-2xl border border-slate-200 hover:border-teal-600 hover:bg-teal-50/40 text-left text-xs sm:text-sm font-medium text-medNavy-900 cursor-pointer&quot;&gt;
                ${ch.text}
              &lt;/button&gt;
            `).join(&quot;&quot;)}
          &lt;/div&gt;
          &lt;div id=&quot;g1-fb&quot; class=&quot;hidden p-4 rounded-2xl text-xs sm:text-sm&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      `;
      stg.querySelectorAll(&quot;.g1-opt-btn&quot;).forEach(btn =&gt; {
        btn.addEventListener(&quot;click&quot;, () =&gt; {
          const ch = GAME1_CASES[g1Idx].choices[Number(btn.dataset.g1Opt)];
          g1Pts += ch.pts;

    function evaluateHOTS() {

      const mcqPts = mcqCorrect * 10;

      const shortPts = HOTS_SHORT.reduce((acc, s) =&gt; {
        const v = document.getElementById(s.id).value.trim();
        const pts = v.length &gt;= 30 ? 5 : (v.length &gt; 0 ? 3 : 0);
        const fb = document.getElementById(`hots-short-fb-${s.id}`);
        fb.classList.remove(&quot;hidden&quot;);

          &lt;p&gt;• &lt;strong&gt;Skor 2–3 (Cukup–Baik):&lt;/strong&gt; Menyebutkan 2 faktor triadic dan 1 sumber efikasi diri yang relevan.&lt;/p&gt;
          &lt;p&gt;• &lt;strong&gt;Skor 0–1 (Kurang):&lt;/strong&gt; Tidak mengaitkan kasus dengan teori Bandura.&lt;/p&gt;
        &lt;/div&gt;

          &lt;p&gt;&lt;strong&gt;Pembahasan &amp; Rubrik Penilaian (Skor 0–4 per Kriteria • Perolehan: ${probPts}/15):&lt;/strong&gt;&lt;/p&gt;
          &lt;p&gt;• &lt;strong&gt;Skor 4 (Sangat Baik):&lt;/strong&gt; Memuat tujuan ABCD terukur, ≥2 alternatif strategi belajar aktif (latihan soal kasus, ringkasan, pengaturan tidur), dan rencana Jika–Maka spesifik berbasis waktu/pemicu.&lt;/p&gt;

          &lt;p&gt;• &lt;strong&gt;Skor 0–1 (Kurang):&lt;/strong&gt; Solusi hanya berupa niat umum tanpa langkah terukur.&lt;/p&gt;
        &lt;/div&gt;
      `;

      document.getElementById(&quot;hots-rubric-crit&quot;).classList.remove(&quot;hidden&quot;);
      document.getElementById(&quot;hots-rubric-crit&quot;).innerHTML = `

    function renderCPChart() {

    function buildCSVString() {
      const headers = [&quot;Timestamp&quot;, &quot;Event&quot;, &quot;Nama&quot;, &quot;NPM&quot;, &quot;Kelompok&quot;, &quot;Fasilitator&quot;, &quot;Tahap&quot;, &quot;Consent&quot;, &quot;GSES_Pre&quot;, &quot;GSES_Post&quot;, &quot;Delta_GSES&quot;, &quot;PreTest_40&quot;, &quot;PostTest_40&quot;, &quot;Delta_Test&quot;, &quot;HOTS_100&quot;, &quot;ASSURE_Mean&quot;, &quot;LK_Terisi&quot;];
      const rows = rekapRecords.map(r =&gt; [
        r.timestamp, r.event, r.nama, r.npm, r.kelompok, r.fasilitator, r.tahap, r.persetujuan,
        r.gsesPre ?? &quot;&quot;, r.gsesPost ?? &quot;&quot;, r.deltaGses ?? &quot;&quot;, r.preTest ?? &quot;&quot;, r.postTest ?? &quot;&quot;, r.deltaTest ?? &quot;&quot;, r.hots ?? &quot;&quot;, r.assureMean ?? &quot;&quot;, r.lkCount ?? 0
      ].map(v =&gt; `&quot;${String(v).replace(/&quot;/g, '&quot;&quot;')}&quot;`).join(&quot;,&quot;));
      return [headers.join(&quot;,&quot;), ...rows].join(&quot;\n&quot;);
    }

    function triggerDownload(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement(&quot;a&quot;);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
